name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Lint fixture corpus (expect findings)
        run: |
          mvn -q -DskipTests package
          java -jar target/safe-sql-lint-1.0.0-SNAPSHOT.jar \
            --format both \
            src/test/resources/fixtures/bad || test $? -eq 1

      - name: Lint good fixtures (expect clean exit)
        run: |
          java -jar target/safe-sql-lint-1.0.0-SNAPSHOT.jar \
            --format json \
            src/test/resources/fixtures/good/PreparedBind.java \
            src/test/resources/fixtures/good/StaticQuery.java
